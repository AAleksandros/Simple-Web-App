services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    # POSTGRES_USER/PASSWORD/DB come from this file. ${...} interpolation would
    # read the shell or a root .env, not env_file, and leave them blank.
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Set POSTGRES_HOST_PORT if something on the host already uses 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    container_name: django_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

volumes:
  postgres_data: